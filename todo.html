<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal – Build Checklist</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:       #FADADD;
      --blue:       #B3D9F7;
      --page-bg:    #FEF0F5;
      --primary:    #5B9BD5;
      --primary-lt: #7BBCF0;
      --accent:     #E88FAB;
      --deep-pink:  #B5295A;
      --heading:    #1A1A2E;
      --nav:        #2D3556;
      --subtitle:   #5B7BA8;
      --body:       #4B5563;
      --muted:      #6B7280;
      --card:       #FFFFFF;
      --divider:    #F3E0E8;
      --success-bg: #E6FAF0;
      --success-tx: #166534;
      --success-bd: #86EFAC;
      --warn-bg:    #FFFBEB;
      --warn-tx:    #B45309;
      --warn-bd:    #FCD34D;
    }

    html { font-size: 16px; font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #FADADD 0%, #EBF4FE 60%, #B3D9F7 100%);
      padding: 2rem 1rem 4rem;
      color: var(--heading);
    }

    /* ── Page header ──────────────────────────────────────── */
    .page-header {
      max-width: 860px;
      margin: 0 auto 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .page-header .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #FFE4EC;
      color: var(--deep-pink);
      border: 1px solid #F9A8C9;
      width: fit-content;
    }

    .page-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--heading);
      line-height: 1.2;
    }

    .page-header p {
      color: var(--subtitle);
      font-size: 0.95rem;
    }

    /* ── Global progress bar ─────────────────────────────── */
    .global-progress-card {
      max-width: 860px;
      margin: 0 auto 2rem;
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 2px 12px rgba(91,155,213,0.10);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .global-progress-card .prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--nav);
    }

    .prog-bar-track {
      height: 10px;
      border-radius: 9999px;
      background: #F3E0E8;
      overflow: hidden;
    }

    .prog-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #E88FAB, #5B9BD5);
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }

    /* ── Filter tabs ──────────────────────────────────────── */
    .filter-row {
      max-width: 860px;
      margin: 0 auto 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      border: 2px solid #F9A8C9;
      background: white;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }

    .filter-btn.active {
      background: linear-gradient(135deg, #5B9BD5, #7BBCF0);
      border-color: transparent;
      color: white;
    }

    /* ── Feature group card ───────────────────────────────── */
    .feature-group {
      max-width: 860px;
      margin: 0 auto 1.25rem;
      background: var(--card);
      border-radius: 1.25rem;
      box-shadow: 0 2px 12px rgba(91,155,213,0.08);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .feature-group:hover { box-shadow: 0 4px 24px rgba(91,155,213,0.16); }

    /* group header / toggle */
    .group-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }

    .group-header:hover { background: #FEF0F5; }

    .group-header.open { border-bottom-color: var(--divider); }

    .group-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .group-meta { flex: 1; min-width: 0; }

    .group-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .group-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .group-count {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
    }

    .group-count.done   { background: var(--success-bg); color: var(--success-tx); }
    .group-count.partial { background: #EBF4FE; color: var(--primary); }
    .group-count.none   { background: #F3F4F6; color: var(--muted); }

    .chevron {
      width: 1.1rem;
      height: 1.1rem;
      color: var(--muted);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }

    .group-header.open .chevron { transform: rotate(180deg); }

    /* mini progress inside header */
    .mini-prog-track {
      width: 72px;
      height: 5px;
      border-radius: 9999px;
      background: #F3E0E8;
      overflow: hidden;
    }

    .mini-prog-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #E88FAB, #5B9BD5);
      transition: width 0.5s;
    }

    /* ── Step list ────────────────────────────────────────── */
    .step-list {
      display: none;
      padding: 0.5rem 0 0.75rem;
    }

    .step-list.open { display: block; }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      margin: 0.15rem 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }

    .step-item:hover { background: #FEF0F5; }

    .step-item.completed { opacity: 0.6; }

    .checkbox {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 0.35rem;
      border: 2px solid #F9A8C9;
      flex-shrink: 0;
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: all 0.2s;
    }

    .step-item.completed .checkbox {
      background: linear-gradient(135deg, #5B9BD5, #7BBCF0);
      border-color: transparent;
    }

    .checkmark {
      width: 0.55rem;
      height: 0.55rem;
      stroke: white;
      stroke-width: 3;
      fill: none;
      display: none;
    }

    .step-item.completed .checkmark { display: block; }

    .step-text {
      font-size: 0.88rem;
      color: var(--body);
      line-height: 1.5;
      flex: 1;
    }

    .step-item.completed .step-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .step-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      flex-shrink: 0;
      margin-top: 0.15rem;
    }

    /* ── Tag colours ─────────────────────────────────────── */
    .tag-ui       { background: #FFE4EC; color: #B5295A; }
    .tag-logic    { background: #EBF4FE; color: #1E5FA8; }
    .tag-a11y     { background: #FFF3E0; color: #B45309; }
    .tag-data     { background: #E6FAF0; color: #166534; }
    .tag-routing  { background: #F3E8FF; color: #7E22CE; }

    /* ── Empty state ─────────────────────────────────────── */
    .no-results {
      max-width: 860px;
      margin: 3rem auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      display: none;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      max-width: 860px;
      margin: 2rem auto 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--subtitle);
    }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .step-list.open { animation: fadeSlide 0.2s ease-out; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 600px) {
      .page-header h1 { font-size: 1.4rem; }
      .mini-prog-track { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Page Header ──────────────────────────────────────── -->
<div class="page-header">
  <span class="badge">📋 Build Checklist</span>
  <h1>University of San Agustin — Student Portal</h1>
  <p>Version 1.0.0 · React + TypeScript + Tailwind CSS v4 · All features from the Design Doc</p>
</div>

<!-- ── Global Progress ──────────────────────────────────── -->

  </div>
  <div class="prog-bar-track">

  </div>
</div>

<!-- ── Filter Tabs ──────────────────────────────────────── -->
<div class="filter-row" role="group" aria-label="Filter tasks">

  <button class="filter-btn" onclick="setFilter('incomplete', this)">Incomplete</button>
  <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
  <button class="filter-btn" onclick="setFilter('ui', this)">🎨 UI</button>
  <button class="filter-btn" onclick="setFilter('logic', this)">⚙️ Logic</button>
  <button class="filter-btn" onclick="setFilter('a11y', this)">♿ A11y</button>
  <button class="filter-btn" onclick="setFilter('data', this)">💾 Data</button>
  <button class="filter-btn" onclick="setFilter('routing', this)">🔀 Routing</button>
</div>

<!-- ── Feature Groups ──────────────────────────────────── -->
<div id="groups-container"></div>
<p class="no-results" id="no-results">No tasks match this filter.</p>

<div class="footer">
  University of San Agustin Student Portal · Build Checklist · v1.0.0
</div>

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
// completed = Set of "groupId::stepIndex" strings
const STORAGE_KEY = 'usa-portal-todo-v1';
let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let currentFilter = 'all';

/* ═══════════════════════════════════════════════════════════
   PERSISTENCE
═══════════════════════════════════════════════════════════ */
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
}

/* ═══════════════════════════════════════════════════════════
   TOGGLE STEP
═══════════════════════════════════════════════════════════ */
function toggleStep(key) {
  if (completed.has(key)) completed.delete(key);
  else completed.add(key);
  save();
  renderAll();
}

/* ═══════════════════════════════════════════════════════════
   TOGGLE GROUP OPEN
═══════════════════════════════════════════════════════════ */
const openGroups = new Set(FEATURES.map(f => f.id)); // all open by default

function toggleGroup(id) {
  if (openGroups.has(id)) openGroups.delete(id);
  else openGroups.add(id);
  renderAll();
}

/* ═══════════════════════════════════════════════════════════
   FILTER
═══════════════════════════════════════════════════════════ */
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function stepMatchesFilter(groupId, stepIdx, step) {
  const key = `${groupId}::${stepIdx}`;
  const isDone = completed.has(key);

  if (currentFilter === 'all') return true;
  if (currentFilter === 'completed') return isDone;
  if (currentFilter === 'incomplete') return !isDone;
  // tag filters
  return step.tags.includes(currentFilter);
}

/* ═══════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════ */
function renderAll() {
  const container = document.getElementById('groups-container');
  container.innerHTML = '';

  let totalSteps = 0, totalDone = 0;
  let visibleGroups = 0;

  FEATURES.forEach(feat => {
    const steps = feat.steps;
    // which steps match filter AND exist in this group?
    const visibleSteps = steps.map((s, i) => ({ s, i })).filter(({ s, i }) => stepMatchesFilter(feat.id, i, s));
    if (visibleSteps.length === 0) return;
    visibleGroups++;

    const groupDone = steps.filter((_, i) => completed.has(`${feat.id}::${i}`)).length;
    const groupTotal = steps.length;
    totalSteps += groupTotal;
    totalDone += groupDone;

    const isOpen = openGroups.has(feat.id);
    const pct = groupTotal > 0 ? Math.round((groupDone / groupTotal) * 100) : 0;

    // count class
    let countClass = 'none';
    if (groupDone === groupTotal) countClass = 'done';
    else if (groupDone > 0) countClass = 'partial';

    const groupEl = document.createElement('div');
    groupEl.className = 'feature-group';
    groupEl.innerHTML = `
      <button
        class="group-header ${isOpen ? 'open' : ''}"
        onclick="toggleGroup('${feat.id}')"
        aria-expanded="${isOpen}"
        aria-controls="steps-${feat.id}"
      >
        <div class="group-icon" style="background:${feat.iconBg}">${feat.icon}</div>
        <div class="group-meta">
          <div class="group-title">${feat.title}</div>
          <div class="group-subtitle">${feat.subtitle}</div>
        </div>
        <div class="group-right">
          <div class="mini-prog-track">
            <div class="mini-prog-fill" style="width:${pct}%"></div>
          </div>
          <span class="group-count ${countClass}">${groupDone}/${groupTotal}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </button>

      <div class="step-list ${isOpen ? 'open' : ''}" id="steps-${feat.id}" role="list">
        ${visibleSteps.map(({ s, i }) => {
          const key = `${feat.id}::${i}`;
          const isDone = completed.has(key);
          return `
            <div
              class="step-item ${isDone ? 'completed' : ''}"
              role="listitem"
              onclick="toggleStep('${key}')"
              tabindex="0"
              onkeydown="if(event.key==='Enter'||event.key===' '){toggleStep('${key}');event.preventDefault();}"
              aria-label="${isDone ? 'Mark incomplete' : 'Mark complete'}: ${s.text}"
            >
              <div class="checkbox" aria-hidden="true">
                <svg class="checkmark" viewBox="0 0 10 8">
                  <polyline points="1 4 4 7 9 1"/>
                </svg>
              </div>
              <span class="step-text">${s.text}</span>
              ${s.tags.map(t => `<span class="step-tag tag-${t}">${tagLabel(t)}</span>`).join('')}
            </div>
          `;
        }).join('')}
      </div>
    `;

    container.appendChild(groupEl);
  });

  // no results
  document.getElementById('no-results').style.display = visibleGroups === 0 ? 'block' : 'none';

  // global progress
  const gpct = totalSteps > 0 ? Math.round((totalDone / totalSteps) * 100) : 0;
  document.getElementById('global-fill').style.width = `${gpct}%`;
  document.getElementById('global-pct').textContent = `${totalDone} / ${totalSteps} steps (${gpct}%)`;
}

function tagLabel(tag) {
  const map = { ui:'🎨 UI', logic:'⚙️ Logic', a11y:'♿ A11y', data:'💾 Data', routing:'🔀 Routing' };
  return map[tag] || tag;
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
renderAll();
</script>
