<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - Sign In | University of San Agustin</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
  
  <!-- JS -->
  <script src="js/auth.js" defer></script>
  <script src="js/design-note.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="full-page">
  
  <a class="skip-link" href="#login-form">Skip to login form</a>

  <div class="page-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 class="text-heading" style="font-weight: 700;">University of San Agustin</h1>
      <p class="text-subtitle" style="font-size: 1.1rem; margin-top: 0.5rem;">Student Portal - Sign In</p>
    </div>

    <!-- Status Banners -->
    <div id="status-container" style="width: 100%; max-width: 28rem; margin-bottom: 1.5rem;" class="hidden" aria-live="polite" aria-atomic="true">
      <!-- Injected by JS -->
    </div>

    <!-- Main Card -->
    <div class="card card-lg" style="width: 100%; max-width: 28rem;">
      <form id="login-form" novalidate>
        
        <!-- Student ID -->
        <div class="form-group mb-4">
          <label for="studentId" class="form-label">Student ID <span class="required-star" aria-label="required">*</span></label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="studentId" 
              name="studentId" 
              class="input-field" 
              inputmode="numeric" 
              autocomplete="username" 
              placeholder="e.g. 20210001" 
              aria-required="true" 
              aria-describedby="studentId-hint" 
            />
          </div>
          <div id="studentId-hint" class="input-hint">
            Your 8-10 digit student ID from your enrollment form.
          </div>
          <div id="studentId-error-container"></div>
        </div>

        <!-- Password -->
        <div class="form-group mb-4">
          <label for="password" class="form-label">Password <span class="required-star" aria-label="required">*</span></label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field has-right-icon" 
              autocomplete="current-password" 
              placeholder="Enter your password" 
              aria-required="true"
            />
            <button type="button" id="toggle-password" class="input-right-btn" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div id="password-error-container"></div>
          
          <div style="text-align: left; margin-top: 0.5rem;">
            <a href="#" class="text-sm">Forgot password?</a>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn" class="btn btn-primary btn-full flex justify-center mt-6">
          Sign In
        </button>
      </form>

      <div class="divider"></div>

      <div class="text-center">
        <span class="text-sm text-muted">New student?</span>
        <a href="register.html" class="text-sm font-semibold">Create your account here</a>
      </div>
    </div>
    
    <!-- Help Tip Box -->
    <div class="help-tip" style="width: 100%; max-width: 28rem; margin-top: 1.5rem;" role="note">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </svg>
      <div>
        Use the Student ID from your enrollment form. If you have trouble logging in, contact 
        <a href="mailto:registrar@usa.edu.ph" class="font-semibold text-primary">registrar@usa.edu.ph</a>
      </div>
    </div>

    <!-- Design Notes -->
    <div class="design-notes-row" style="width: 100%; max-width: 28rem; justify-content: center; margin-top: 2rem;">
    
    </div>

  </div>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
